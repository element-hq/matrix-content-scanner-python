# GitHub actions workflow which builds and publishes the docker images.

name: Build docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # A build was manually requested

# Disable all permissions for the GITHUB_TOKEN access token by default.
permissions: {}

jobs:
  build:
    name: Build Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      # Read git details about the repository
      contents: read
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Push by digest so the native builds cannot overwrite each other's tags.
      - name: Build and push by digest
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          labels: "gitsha1=${{ github.sha }}"
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=vectorim/matrix-content-scanner,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish multi-platform Docker images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Only the final manifest needs signing with the GitHub OIDC Token.
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          # Ensure imagetools supports --metadata-file for signing the exact digest.
          version: v0.36.1
          cache-binary: false

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Calculate docker image tag
        id: set-tag
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc # master
        with:
          images: vectorim/matrix-content-scanner
          tags: |
            type=raw,value=latest
            type=pep440,pattern={{raw}}

      - name: Publish multi-platform manifest
        id: create-manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.set-tag.outputs.tags }}
        run: |
          sources=()
          # Require both native builds before updating any public tags.
          for arch in amd64 arm64; do
            IFS= read -r digest < "$arch"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("vectorim/matrix-content-scanner@$digest")
          done

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest-metadata.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
          TAGS: ${{ steps.set-tag.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              images+=("$tag@$DIGEST")
            fi
          done <<< "$TAGS"
          cosign sign --yes "${images[@]}"
